<svg viewBox="0 0 1424 600" aria-label="Der Baum holt CO₂ seit Jahrmillionen von selbst aus der Luft; Ingenieure bauen dafür eine Maschine mit Gebläsen, Wärme, Strom und Speicher. Braucht es die?" xmlns="http://www.w3.org/2000/svg" width="1424" height="600">
      <defs><marker id="ah-zw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="rgb(93,102,95)"/></marker></defs>
      <g font-family="Arial">
        <!-- the tree: there already, by itself -->
        <g>
          <g stroke="#d9a441" stroke-width="4" stroke-linecap="round">
            <line x1="80" y1="34" x2="80" y2="48"/><line x1="80" y1="132" x2="80" y2="146"/><line x1="24" y1="90" x2="38" y2="90"/><line x1="122" y1="90" x2="136" y2="90"/>
            <line x1="41" y1="51" x2="51" y2="61"/><line x1="109" y1="119" x2="119" y2="129"/><line x1="41" y1="129" x2="51" y2="119"/><line x1="109" y1="61" x2="119" y2="51"/>
          </g>
          <circle cx="80" cy="90" r="30" fill="#e8b84f"/>
          <path d="M0 470 C 90 410 300 396 420 430 L420 470Z" fill="#cbd6b4"/>
          <rect x="300" y="300" width="14" height="118" fill="#3b3024"/>
          <circle cx="307" cy="270" r="54" fill="#8ea477"/><circle cx="276" cy="306" r="37" fill="#a9bc8f"/><circle cx="339" cy="308" r="35" fill="#7f9c64"/>
          <rect x="178" y="214" width="24" height="210" fill="#3b3024"/>
          <circle cx="190" cy="154" r="96" fill="#6f8f55"/><circle cx="135" cy="224" r="66" fill="#7f9c64"/><circle cx="248" cy="228" r="62" fill="#5f7f48"/>
          <text x="440" y="150" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">DIE NATUR</text>
          <text x="440" y="198" font-family="Georgia" font-size="38" font-weight="bold" fill="rgb(61,85,45)">Der Baum</text>
          <text x="440" y="252" font-size="23" fill="rgb(27,36,32)">seit Jahrmillionen</text>
          <text x="440" y="288" font-size="23" fill="rgb(27,36,32)">mit Sonnenlicht</text>
          <text x="440" y="324" font-size="23" fill="rgb(27,36,32)">wächst von selbst</text>
        </g>
        <line x1="742" y1="40" x2="742" y2="440" stroke="rgb(214,204,182)" stroke-width="2"/>
        <!-- the machine: built, powered, complicated -->
        <g>
          <rect x="780" y="430" width="380" height="40" fill="#d9cfb9"/>
          <path d="M780 450 H1160" stroke="#c3b79c" stroke-width="2"/>
          <line x1="780" y1="430" x2="1160" y2="430" stroke="#8c7a58" stroke-width="3" stroke-linecap="round"/>
          <rect x="912" y="330" width="30" height="100" fill="#5d665f"/>
          <rect x="800" y="220" width="200" height="110" rx="10" fill="rgb(30,83,109)"/>
          <g fill="rgb(242,237,226)"><circle cx="840" cy="275" r="26"/><circle cx="900" cy="275" r="26"/><circle cx="960" cy="275" r="26"/></g>
          <g stroke="rgb(30,83,109)" stroke-width="4" stroke-linecap="round"><path d="M840 256 V294 M821 275 H859"/><path d="M900 256 V294 M881 275 H919"/><path d="M960 256 V294 M941 275 H979"/></g>
          <g stroke="rgb(200,100,26)" stroke-width="3.5" fill="none" stroke-linecap="round">
            <path d="M826 370 q7 -7 0 -14 q-7 -7 0 -14"/><path d="M856 370 q7 -7 0 -14 q-7 -7 0 -14"/><path d="M886 370 q7 -7 0 -14 q-7 -7 0 -14"/>
          </g>
          <path d="M1000 300 H1060 V346" stroke="#5d665f" stroke-width="8" fill="none"/>
          <rect x="1036" y="346" width="58" height="44" rx="6" fill="#5d665f"/>
          <path d="M1065 390 V466" stroke="#5d665f" stroke-width="8"/>
          <path d="M1036 126 L1020 160 H1036 L1022 194 L1056 150 H1040 L1052 126Z" fill="#d9a441"/>
          <path d="M1036 196 L1004 222" stroke="#d9a441" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
          <g font-size="17" fill="rgb(93,102,95)">
            <text x="800" y="206">Gebläse</text>
            <text x="1064" y="160">Strom</text>
            <text x="1100" y="380">Verdichter</text>
            <text x="796" y="398">Dampf, 100 °C</text>
            <text x="1080" y="498" text-anchor="middle">Speicher im Gestein</text>
          </g>
          <text x="1168" y="150" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">INGENIEURE</text>
          <text x="1168" y="198" font-family="Georgia" font-size="38" font-weight="bold" fill="rgb(30,83,109)">Die Maschine</text>
          <text x="1168" y="252" font-size="23" fill="rgb(27,36,32)">Direct Air Capture</text>
          <text x="1168" y="288" font-size="23" fill="rgb(27,36,32)">braucht Energie</text>
          <text x="1168" y="324" font-size="23" fill="rgb(27,36,32)">muss gebaut werden</text>
        </g>
        <!-- the question -->
        <text x="712" y="574" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="46" fill="rgb(110,61,58)">Braucht es die Maschine überhaupt?</text>
      </g>
    </svg>