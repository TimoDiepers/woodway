<svg viewBox="0 0 1424 470" aria-label="Sorbens-DAC in drei Schritten und sein Energiebedarf je Tonne CO₂" xmlns="http://www.w3.org/2000/svg" width="1424" height="470">
      <defs><marker id="ah-dp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="rgb(93,102,95)"/></marker></defs>
      <g font-family="Arial">
        <!-- 1 Ansaugen -->
        <g>
          <rect x="40" y="60" width="210" height="140" rx="10" fill="rgb(231,224,208)" stroke="rgb(30,83,109)" stroke-width="3"/>
          <circle cx="90" cy="130" r="30" fill="rgb(30,83,109)"/>
          <path d="M90 108 V152 M68 130 H112" stroke="rgb(231,224,208)" stroke-width="5" stroke-linecap="round"/>
          <rect x="140" y="72" width="60" height="116" fill="#d8cfbb"/>
          <path d="M150 72 V188 M160 72 V188 M170 72 V188 M180 72 V188 M190 72 V188" stroke="#b8ab8e" stroke-width="2"/>
          <g fill="rgb(46,125,79)"><circle cx="146" cy="92" r="6"/><circle cx="168" cy="120" r="6"/><circle cx="152" cy="150" r="6"/><circle cx="186" cy="104" r="6"/><circle cx="176" cy="168" r="6"/></g>
          <path d="M2 110 H36 M2 150 H36" stroke="rgb(93,102,95)" stroke-width="3" fill="none" marker-end="url(#ah-dp)"/>
          <path d="M226 56 V22" stroke="rgb(93,102,95)" stroke-width="3" fill="none" marker-end="url(#ah-dp)"/>
          <text x="240" y="24" font-size="18" fill="rgb(93,102,95)">Luft ohne CO₂</text>
          <circle cx="24" cy="272" r="20" fill="rgb(30,83,109)"/><text x="24" y="280" text-anchor="middle" font-size="22" font-weight="bold" fill="rgb(242,237,226)">1</text>
          <text x="56" y="281" font-size="26" font-weight="bold" fill="rgb(27,36,32)">Ansaugen</text>
          <text x="4" y="326" font-size="20" fill="rgb(63,74,68)">Gebläse drücken Luft durch</text>
          <text x="4" y="354" font-size="20" fill="rgb(63,74,68)">ein Sorbens (Amin). Das CO₂</text>
          <text x="4" y="382" font-size="20" fill="rgb(63,74,68)">bleibt daran haften.</text>
          <rect x="4" y="408" width="90" height="38" rx="19" fill="rgb(157,191,207)"/><text x="49" y="434" text-anchor="middle" font-size="19" fill="rgb(27,36,32)">Strom</text>
        </g>
        <path d="M262 130 H338" stroke="rgb(46,125,79)" stroke-width="4" fill="none" marker-end="url(#ah-dp)"/>
        <!-- 2 Ablösen -->
        <g>
          <rect x="350" y="60" width="210" height="140" rx="10" fill="rgb(231,224,208)" stroke="rgb(30,83,109)" stroke-width="3"/>
          <rect x="425" y="72" width="60" height="116" fill="#d8cfbb"/>
          <path d="M435 72 V188 M445 72 V188 M455 72 V188 M465 72 V188 M475 72 V188" stroke="#b8ab8e" stroke-width="2"/>
          <g fill="rgb(46,125,79)"><circle cx="392" cy="96" r="6"/><circle cx="510" cy="88" r="6"/><circle cx="398" cy="160" r="6"/><circle cx="520" cy="150" r="6"/><circle cx="500" cy="118" r="6"/></g>
          <g stroke="rgb(200,100,26)" stroke-width="4" fill="none" stroke-linecap="round">
            <path d="M400 238 q8 -8 0 -16 q-8 -8 0 -16"/><path d="M455 238 q8 -8 0 -16 q-8 -8 0 -16"/><path d="M510 238 q8 -8 0 -16 q-8 -8 0 -16"/>
          </g>
          <circle cx="334" cy="272" r="20" fill="rgb(30,83,109)"/><text x="334" y="280" text-anchor="middle" font-size="22" font-weight="bold" fill="rgb(242,237,226)">2</text>
          <text x="366" y="281" font-size="26" font-weight="bold" fill="rgb(27,36,32)">Ablösen</text>
          <text x="314" y="326" font-size="20" fill="rgb(63,74,68)">Kammer zu: Vakuum und</text>
          <text x="314" y="354" font-size="20" fill="rgb(63,74,68)">Dampf um 100 °C lösen</text>
          <text x="314" y="382" font-size="20" fill="rgb(63,74,68)">das CO₂ wieder ab.</text>
          <rect x="314" y="408" width="200" height="38" rx="19" fill="#efcfae"/><text x="414" y="434" text-anchor="middle" font-size="19" fill="rgb(27,36,32)">Wärme um 100 °C</text>
        </g>
        <path d="M572 130 H648" stroke="rgb(46,125,79)" stroke-width="4" fill="none" marker-end="url(#ah-dp)"/>
        <!-- 3 Speichern -->
        <g>
          <rect x="660" y="150" width="230" height="56" fill="#d9cfb9"/>
          <path d="M660 168 H890 M660 188 H890" stroke="#c3b79c" stroke-width="2"/>
          <line x1="660" y1="150" x2="890" y2="150" stroke="#8c7a58" stroke-width="3"/>
          <rect x="664" y="84" width="104" height="56" rx="8" fill="rgb(30,83,109)"/>
          <text x="716" y="118" text-anchor="middle" font-size="16" fill="rgb(242,237,226)">Verdichter</text>
          <path d="M768 112 H800 V198" stroke="#5d665f" stroke-width="10" fill="none"/>
          <g fill="rgb(46,125,79)"><circle cx="790" cy="200" r="6"/><circle cx="808" cy="196" r="6"/><circle cx="800" cy="186" r="6"/></g>
          <circle cx="644" cy="272" r="20" fill="rgb(30,83,109)"/><text x="644" y="280" text-anchor="middle" font-size="22" font-weight="bold" fill="rgb(242,237,226)">3</text>
          <text x="676" y="281" font-size="26" font-weight="bold" fill="rgb(27,36,32)">Speichern</text>
          <text x="624" y="326" font-size="20" fill="rgb(63,74,68)">Verdichten, transportieren</text>
          <text x="624" y="354" font-size="20" fill="rgb(63,74,68)">und in tiefen Gesteins-</text>
          <text x="624" y="382" font-size="20" fill="rgb(63,74,68)">schichten einlagern.</text>
          <rect x="624" y="408" width="90" height="38" rx="19" fill="rgb(157,191,207)"/><text x="669" y="434" text-anchor="middle" font-size="19" fill="rgb(27,36,32)">Strom</text>
        </g>
        <!-- Energie je Tonne -->
        <g>
          <line x1="940" y1="20" x2="940" y2="450" stroke="rgb(214,204,182)" stroke-width="2"/>
          <text x="975" y="44" font-size="24" font-weight="bold" fill="rgb(27,36,32)">Energie je Tonne CO₂</text>
          <text x="975" y="100" font-size="19" fill="rgb(93,102,95)">Wärme direkt zugeführt</text>
          <rect x="975" y="114" width="270" height="46" fill="rgb(200,100,26)"/><text x="989" y="145" font-size="19" fill="#fff">Wärme 1,5</text>
          <rect x="1245" y="114" width="90" height="46" fill="rgb(30,83,109)"/><text x="1290" y="145" text-anchor="middle" font-size="18" fill="#fff">Strom 0,5</text>
          <text x="1345" y="145" font-size="19" fill="rgb(27,36,32)">MWh</text>
          <path d="M1110 166 V206" stroke="rgb(93,102,95)" stroke-width="3" fill="none" marker-end="url(#ah-dp)"/>
          <text x="1124" y="194" font-size="18" fill="rgb(93,102,95)">Wärmepumpe</text>
          <text x="975" y="236" font-size="19" fill="rgb(93,102,95)">mit Wärmepumpe: nur noch Strom</text>
          <rect x="975" y="250" width="90" height="46" fill="rgb(30,83,109)"/><text x="1020" y="281" text-anchor="middle" font-size="18" fill="#fff">0,5</text>
          <rect x="1065" y="250" width="180" height="46" fill="rgb(157,191,207)"/><text x="1155" y="281" text-anchor="middle" font-size="18" fill="rgb(27,36,32)">für die Wärme ≈ 1</text>
          <text x="1255" y="281" font-size="19" font-weight="bold" fill="rgb(27,36,32)">≈ 1,5 MWh</text>
          <text x="975" y="350" font-size="20" fill="rgb(63,74,68)">Je nach Wetter 1,1 bis 1,9 MWh:</text>
          <text x="975" y="378" font-size="20" fill="rgb(63,74,68)">Kalte Luft drückt die Wärmepumpe,</text>
          <text x="975" y="406" font-size="20" fill="rgb(63,74,68)">feuchte Luft kostet Wärme.</text>
        </g>
      </g>
    </svg>