<svg viewBox="0 0 1424 470" aria-label="Rechenweg: Wetter und Prozessmodell ergeben den Strom je Tonne; mit dem Strommix rechnet die Ökobilanz daraus die Emissionen; daraus der Netto-Wirkungsgrad" xmlns="http://www.w3.org/2000/svg" width="1424" height="470">
