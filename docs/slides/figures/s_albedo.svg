<svg viewBox="0 0 1424 500" aria-label="Schema: Sonnenlicht auf Baum und Boden, zurückgeworfener und geschluckter Anteil" xmlns="http://www.w3.org/2000/svg" width="1424" height="500"><defs><marker id="ah-al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#d9822b"/></marker></defs><g font-family="Arial"><g transform="translate(40 30) scale(1.18)"><rect x="10" y="330" width="500" height="10" fill="#b9cf96"/><rect x="10" y="340" width="500" height="30" fill="#d9cfb9"/><path d="M10 355 H510" stroke="#c3b79c" stroke-width="2"/><line x1="10" y1="340" x2="510" y2="340" stroke="#8c7a58" stroke-width="3" stroke-linecap="round"/><rect x="123" y="210" width="15" height="130" fill="#3b3024"/><circle cx="130" cy="173" r="60" fill="#3d5a2e"/><circle cx="96" cy="216" r="41" fill="#4a6b38"/><circle cx="166" cy="218" r="38" fill="#33502a"/><g stroke="#d9a441" stroke-width="4" stroke-linecap="round"><line x1="68.0" y1="48.0" x2="80.0" y2="48.0"/><line x1="12.0" y1="48.0" x2="0.0" y2="48.0"/><line x1="40.0" y1="76.0" x2="40.0" y2="88.0"/><line x1="40.0" y1="20.0" x2="40.0" y2="8.0"/><line x1="59.8" y1="67.8" x2="68.3" y2="76.3"/><line x1="20.2" y1="67.8" x2="11.7" y2="76.3"/><line x1="59.8" y1="28.2" x2="68.3" y2="19.7"/><line x1="20.2" y1="28.2" x2="11.7" y2="19.7"/></g><circle cx="40" cy="48" r="20" fill="#e8b84f"/><path d="M64 72 L118 156" stroke="#d9822b" stroke-width="4" fill="none" marker-end="url(#ah-al)"/><path d="M132 156 L170 76" stroke="#d9822b" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round" fill="none" marker-end="url(#ah-al)"/><text x="76" y="30" text-anchor="start" font-size="24" font-weight="bold" fill="rgb(27,36,32)">100 %</text><text x="178" y="92" text-anchor="start" font-size="24" font-weight="bold" fill="rgb(27,36,32)">30 %</text><g><path d="M346 122 L396 322" stroke="#d9822b" stroke-width="4" fill="none" marker-end="url(#ah-al)"/><path d="M408 322 L446 200" stroke="#d9822b" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round" fill="none" marker-end="url(#ah-al)"/><text x="330" y="106" text-anchor="start" font-size="24" font-weight="bold" fill="rgb(27,36,32)">100 %</text><text x="454" y="206" text-anchor="start" font-size="24" font-weight="bold" fill="rgb(27,36,32)">70 %</text></g></g><g><text x="760" y="80" font-family="Georgia" font-size="36" font-weight="bold" fill="rgb(61,85,45)">Was geschluckt wird</text><text x="760" y="140" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">BAUM</text><text x="760" y="172" font-size="26" fill="rgb(27,36,32)">wirft 30 % zurück, schluckt 70 %</text><text x="760" y="232" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">WIESE ODER ACKER</text><text x="760" y="264" font-size="26" fill="rgb(27,36,32)">wirft 70 % zurück, schluckt 30 %</text><rect x="760" y="308" width="430" height="50" rx="25" fill="#efcfae"/><text x="975" y="341" text-anchor="middle" font-size="23" font-weight="bold" fill="rgb(27,36,32)">Baum schluckt 40 % mehr Licht</text><text x="760" y="410" font-size="21" fill="rgb(63,74,68)">Je größer der Baum, desto mehr Boden</text><text x="760" y="438" font-size="21" fill="rgb(63,74,68)">verdeckt er — und desto mehr Licht bleibt.</text></g></g></svg>