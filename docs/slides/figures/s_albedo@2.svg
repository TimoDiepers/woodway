<svg viewBox="0 0 1424 500" aria-label="Schema: Sonnenlicht auf Baum und Boden, zurückgeworfener und geschluckter Anteil" xmlns="http://www.w3.org/2000/svg" width="1424" height="500"><defs><marker id="ah-al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#d9822b"/></marker></defs><g font-family="Arial"><g><text x="760" y="80" font-family="Georgia" font-size="36" font-weight="bold" fill="rgb(61,85,45)">Was geschluckt wird</text><text x="760" y="140" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">BAUM</text><text x="760" y="172" font-size="26" fill="rgb(27,36,32)">wirft 30 % zurück, schluckt 70 %</text><text x="760" y="232" font-size="16" letter-spacing="1.5" fill="rgb(93,102,95)">WIESE ODER ACKER</text><text x="760" y="264" font-size="26" fill="rgb(27,36,32)">wirft 70 % zurück, schluckt 30 %</text><rect x="760" y="308" width="430" height="50" rx="25" fill="#efcfae"/><text x="975" y="341" text-anchor="middle" font-size="23" font-weight="bold" fill="rgb(27,36,32)">Baum schluckt 40 % mehr Licht</text><text x="760" y="410" font-size="21" fill="rgb(63,74,68)">Je größer der Baum, desto mehr Boden</text><text x="760" y="438" font-size="21" fill="rgb(63,74,68)">verdeckt er — und desto mehr Licht bleibt.</text></g></g></svg>