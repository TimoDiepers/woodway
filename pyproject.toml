[project]
name = "nbs"
version = "0.1.0"
description = "Time-explicit climate effect of afforestation and direct air capture, tree by tree and cell by cell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fair>=2.1.0,<3",
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "matplotlib>=3.7",
    "SALib>=1.4",
    "pandas>=2.0",
    "netcdf4>=1.7.4",
    "shapely>=2.1.2",
    "rasterio>=1.4.4",
    "openpyxl>=3.1.5",
    "gurobipy>=13.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
