# Builds woodway (the site root) and the HTML deck (under slides/) and deploys both to GitHub Pages.
name: Woodway und Folien auf GitHub Pages

on:
  push:
    branches: [main]
    paths: ["deck/**", "woodway/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deck/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: woodway/package-lock.json
      - run: npm ci
        working-directory: woodway
      - run: npx vitest run   # a renamed anchor slide of the deck fails here, before anything is deployed
        working-directory: woodway
      - run: npm run build
        working-directory: woodway
      # woodway at the root, the slides under slides/
      - run: mkdir site && cp -R woodway/dist/. site/ && cp -R deck/dist site/slides
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
