# Builds the HTML deck (deck/build.py, standard library only) and deploys deck/dist to GitHub Pages.
name: Deck auf GitHub Pages

on:
  push:
    branches: [main]
    paths: ["deck/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deck/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deck/dist
      - id: deployment
        uses: actions/deploy-pages@v4
